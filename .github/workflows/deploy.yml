name: Build and deploy

# Every pull request and every push to main runs the checks; only a release tag (v1.2.3) deploys
# to GitHub Pages. A manual run started from a tag redeploys that release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue up and never cancel each other; a newer push to a pull request replaces the run
# still checking the previous one
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag and package.json must name the same version, so a release never ships under the wrong number
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # A failing check stops the deploy, so a broken build never reaches Pages
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The game in a real browser: opens, plays, pauses and draws every background without an
      # error, on a desktop and on a phone either way round. The visual checks stay local (their
      # baselines are rendered on Windows)
      - name: Install the browser for the end-to-end checks
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npm run test:e2e

      - name: Keep the end-to-end report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Upload artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.ref_type == 'tag'

    # Only this job may publish to Pages
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
