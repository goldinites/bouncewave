name: Build and deploy

# Every pull request and every push to main runs the checks; only a release tag (v1.2.3) deploys
# to GitHub Pages. A manual run started from a tag redeploys that release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only release tags deploy, so only they share the Pages queue: a check of main or of a pull
# request queued behind a deploy would cancel it while it waits (GitHub keeps one pending run a
# group). Checks get a queue per branch, where a newer push replaces the run checking the last
concurrency:
  group: ${{ github.ref_type == 'tag' && 'pages' || format('checks-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A run takes about 2 minutes; one stuck on a runner (as in a GitHub outage) would otherwise
    # hold the pull request for the default 6 hours. Failed, it can simply be rerun. Time spent
    # queued for a runner doesn't count
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag and package.json must name the same version, so a release never ships under the wrong number
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # A failing check stops the deploy, so a broken build never reaches Pages
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The game in a real browser: opens, plays, pauses and draws every background without an
      # error, on a desktop and on a phone either way round. The visual checks stay local (their
      # baselines are rendered on Windows)
      - name: Install the browser for the end-to-end checks
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npm run test:e2e

      # Every background's frame timed against the budget (e2e/frameBudget.ts); the times go on the
      # run's summary and in a notice, failed or not
      - name: Frame budget
        run: npm run test:perf

      - name: Show the frame times
        if: always()
        run: |
          if [ -f test-results/frame-times.md ]; then
            cat test-results/frame-times.md >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Frame times, drawing p95 (ms)::$(cat test-results/frame-times.txt)"
          fi

      - name: Keep the end-to-end report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Upload artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.ref_type == 'tag'

    # Only this job may publish to Pages
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
