name: Build and deploy

# Pull requests and pushes to main run the checks; only a published release (not a prerelease)
# deploys to GitHub Pages
on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - released

permissions:
  contents: read

# Deploys queue up and never cancel each other; a newer push to a branch or pull request
# replaces the run still checking the previous one
concurrency:
  group: ${{ github.event_name == 'release' && 'pages' || format('checks-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A failing check stops the deploy, so a broken build never reaches Pages
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        if: github.event_name == 'release'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'release'

    # Only this job may publish to Pages
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
