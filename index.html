<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PING PONG</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0320;--pink:#ff2bd6;--cyan:#19f0ff;--text:#f4e9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 30%,#2a0a5e 0,var(--bg) 70%);color:var(--text);font-family:'Orbitron','Russo One',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
#stage{position:relative;width:min(96vw,calc(80vh*1.6));aspect-ratio:8/5;border:2px solid var(--cyan);border-radius:14px;overflow:hidden;background:#000;
box-shadow:0 0 22px var(--cyan),0 0 80px rgba(255,43,214,.45),inset 0 0 40px rgba(25,240,255,.25)}
#c{width:100%;height:100%;display:block;touch-action:none;cursor:none}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;
background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.22) 3px 4px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));animation:flick 5s infinite}
@keyframes flick{0%,100%{opacity:.9}50%{opacity:1}92%{opacity:.75}}
#ui{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;text-align:center;background:rgba(8,2,26,.6);backdrop-filter:blur(3px);transition:opacity .35s}
#ui.off{opacity:0;visibility:hidden;pointer-events:none}
h1{margin:0;font-weight:900;font-size:clamp(22px,5.6vw,58px);letter-spacing:.06em;color:#fff;
text-shadow:0 0 6px #fff,0 0 18px var(--pink),0 0 42px var(--pink),3px 0 rgba(25,240,255,.8),-3px 0 rgba(255,43,214,.8);animation:glitch 3.4s infinite}
@keyframes glitch{0%,90%,100%{transform:none}92%{transform:translate(-4px,1px) skewX(-6deg)}94%{transform:translate(4px,-1px) skewX(5deg)}96%{transform:none}}
#sub{margin:0;font-size:clamp(10px,1.9vw,15px);color:var(--cyan);letter-spacing:.14em;text-shadow:0 0 8px var(--cyan)}
#btns{display:flex;flex-direction:column;gap:12px;margin-top:6px;min-width:clamp(170px,38%,280px)}
button{--c:var(--cyan);font:700 clamp(11px,2vw,15px) inherit;font-family:inherit;letter-spacing:.1em;color:var(--c);background:rgba(8,2,26,.5);border:2px solid var(--c);border-radius:8px;padding:.85em 1.5em;cursor:pointer;filter:drop-shadow(0 0 6px var(--c));transition:transform .15s,background .15s,color .15s}
button+button{--c:var(--pink)}button+button+button{--c:#b79bff}
button:hover,button:focus-visible{background:var(--c);color:#12002e;transform:translateY(-2px);outline:none}

#hint{margin:0;font-size:clamp(10px,1.6vw,13px);color:#b9a4e6;text-align:center;padding:0 12px;line-height:1.6}
#fit{display:contents}
#sub:empty{display:none}
#pbtn{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:5;padding:.5em .85em;font-size:14px;transition:opacity .3s}
#pbtn.x{opacity:0;pointer-events:none}
@media (pointer:coarse){#pbtn{display:block}}
@media (max-height:520px){#hint{display:none}#stage{width:min(96vw,calc(92vh*1.6))}#btns{gap:6px}#btns button{padding:.6em 1.2em}}
@media (orientation:portrait) and (max-width:900px){
:root{--w:min(96vw,50vh)}
#fit{display:block;position:relative;flex:none;width:var(--w);height:calc(var(--w)*1.6)}
#stage{position:absolute;left:50%;top:50%;width:calc(var(--w)*1.6);height:var(--w);aspect-ratio:auto;transform:translate(-50%,-50%) rotate(-90deg)}
#stage::after{background:repeating-linear-gradient(to right,transparent 0 2px,rgba(0,0,0,.22) 3px 4px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
#ui{inset:auto;left:50%;top:50%;width:var(--w);height:calc(var(--w)*1.6);transform:translate(-50%,-50%) rotate(90deg)}
h1{font-size:clamp(30px,11vw,52px)}#sub,#hint{font-size:12px}#btns button{font-size:15px;padding:1em 1.4em}
}
@media (prefers-reduced-motion:reduce){h1,#stage::after{animation:none}}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="c" width="800" height="500"></canvas>
  
  <div id="ui"><h1 id="title">PING PONG</h1><p id="sub"></p><div id="btns"></div></div>
</div>
</div>
<p id="hint"></p>
<button id="pbtn" aria-label="Pause">II</button>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
let R=8;const W=800,H=500,HY=240,PW=14,PH=92,WIN=7,TAU=6.2832;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let scale=1,mode=0,state='menu',prev='play',t=0,scroll=0,shake=0,flash=0,serveT=0,rally=0;
function fit(){const d=Math.min(devicePixelRatio||1,2);cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;scale=cv.width/W}
new ResizeObserver(fit).observe(cv);fit();

const pd=[{x:34,y:H/2,ty:H/2,s:0,g:0,c:'#19f0ff',err:0},{x:W-34-PW,y:H/2,ty:H/2,s:0,g:0,c:'#ff2bd6',err:0}];
const B={x:W/2,y:H/2,vx:0,vy:0,sp:340,tr:[]},parts=[],rings=[],keys={};

/* ---------- audio ---------- */
let ac,muted=false,mmute=false,diff=1,lang='en';try{const s=JSON.parse(localStorage.getItem('neonpong')||'{}');if(s.d>=0&&s.d<4)diff=s.d|0;muted=!!s.m;mmute=!!s.u;if(s.l==='ru')lang='ru'}catch(e){}
function unlock(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();if(ac&&!mf)initMusic()}
function beep(f,d=.08,type='square',v=.06,sl=0,force=0){if(!ac||muted||(mode===0&&!force))return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,n);
if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),n+d);g.gain.setValueAtTime(v*2,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(ac.destination);o.start();o.stop(n+d)}
function save(){try{localStorage.setItem('neonpong',JSON.stringify({d:diff,m:muted,u:mmute,l:lang}))}catch(e){}}
const DIFF=[{sp:250,err:130,acc:.035,mx:640},{sp:340,err:80,acc:.055,mx:760},{sp:440,err:40,acc:.075,mx:840},{sp:560,err:12,acc:.095,mx:920}];
const L={en:{play:'PLAY',settings:'SETTINGS',again:'PLAY AGAIN',resume:'RESUME',menu:'MAIN MENU',back:'BACK',diff:'DIFFICULTY',sound:'EFFECTS',music:'MUSIC',on:'ON',off:'OFF',lang:'LANGUAGE',lname:'ENGLISH',pause:'PAUSED',win:'YOU WIN',lose:'GAME OVER',ready:'GET READY',
hintK:'Paddle: W / S or ↑ / ↓ · mouse or touch works too<br>P — pause · first to 7 points',hintT:'Drag your finger to move the paddle<br>First to 7 points',
d:[['EASY','vs CPU: slow, misses often'],['NORMAL','vs CPU: a balanced opponent'],['HARD','vs CPU: fast and accurate'],['INSANE','vs CPU: barely makes mistakes']]},
ru:{play:'ИГРАТЬ',settings:'НАСТРОЙКИ',again:'ИГРАТЬ СНОВА',resume:'ПРОДОЛЖИТЬ',menu:'В МЕНЮ',back:'НАЗАД',diff:'СЛОЖНОСТЬ',sound:'ЭФФЕКТЫ',music:'МУЗЫКА',on:'ВКЛ',off:'ВЫКЛ',lang:'ЯЗЫК',lname:'РУССКИЙ',pause:'ПАУЗА',win:'ПОБЕДА',lose:'ИГРА ОКОНЧЕНА',ready:'ГОТОВЬСЬ',
hintK:'Ракетка: W / S или ↑ / ↓ · мышь или касание тоже работают<br>P — пауза · играем до 7 очков',hintT:'Двигайте ракетку пальцем<br>Играем до 7 очков',
d:[['ЛЁГКАЯ','Против CPU: медленный, часто мажет'],['СРЕДНЯЯ','Против CPU: сбалансированный соперник'],['СЛОЖНАЯ','Против CPU: быстрый и точный'],['БЕЗУМИЕ','Против CPU: почти не ошибается']]}};
const T=k=>L[lang][k],coarse=matchMedia('(pointer:coarse)').matches,pbtn=$('pbtn');
pbtn.onclick=()=>{unlock();togglePause()};
function applyLang(){document.documentElement.lang=lang;$('hint').innerHTML=T(coarse?'hintT':'hintK')}

/* ---------- synthwave music: layers and tempo follow the game ---------- */
let mi=.3,nextT=0,stp=0,sg0=0,mf,mg,dly,nb,bus,ax;
const CT=[[0,3,7],[0,4,7]],BP=['1010101010101010','1001001010010010','0010001000100010'],TK=[
{b:92,r:[33,29,36,31],t:[0,1,1,1],ap:[0,2,4,2,1,3,5,3,0,2,4,5,3,2,1,2],bs:0,aw:'square'},
{b:100,r:[38,34,29,36],t:[0,1,1,1],ap:[0,1,2,1,3,4,5,4,0,2,1,3,2,4,3,5],bs:1,aw:'sawtooth'},
{b:108,r:[40,36,31,38],t:[0,1,1,1],ap:[2,0,1,2,5,3,4,5,2,0,1,2,5,4,3,1],bs:2,aw:'square'},
{b:116,r:[36,32,34,31],t:[0,1,1,0],ap:[0,3,1,4,2,5,2,4,0,3,1,5,2,4,3,1],bs:0,aw:'sawtooth'}],
hz=m=>440*Math.pow(2,(m-69)/12),trk=s=>TK[(sg0+(s>>8))%TK.length];
function newSong(){stp=(stp|255)+1}
function initMusic(){
nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
bus=ac.createGain();ax=ac.createGain();dly=ac.createDelay(1);mf=ac.createBiquadFilter();mg=ac.createGain();
const fb=ac.createGain(),cp=ac.createDynamicsCompressor();fb.gain.value=.4;mf.frequency.value=2800;mg.gain.value=0;
ax.connect(bus);ax.connect(dly);dly.connect(fb);fb.connect(dly);dly.connect(bus);bus.connect(mf);mf.connect(cp);cp.connect(mg);an=ac.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.75;cp.connect(an);mg.connect(ac.destination);
sg0=Math.random()*TK.length|0;nextT=ac.currentTime+.1;setInterval(sched,25)}
function note(type,m,t,d,v,dst,fc){const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type=type;o.frequency.value=hz(m);
f.frequency.setValueAtTime(fc,t);f.frequency.exponentialRampToValueAtTime(Math.max(150,fc*.2),t+d);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f);f.connect(g);g.connect(dst);o.start(t);o.stop(t+d+.05)}
function pad(ms,t,d,v){for(const m of ms)for(const c of[-9,9]){const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type='sawtooth';o.frequency.value=hz(m);o.detune.value=c;f.frequency.value=700+mi*1800;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+d*.25);g.gain.linearRampToValueAtTime(0,t+d);o.connect(f);f.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05)}}
function kick(t,v){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.3)}
function nz(t,d,v,hp){const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();s.buffer=nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+d+.02)}
function playStep(t,s,sd){const k=trk(s),bar=(s>>4)&3,st=s&15,r=k.r[bar],tr=CT[k.t[bar]],I=mi;if(s%256===0)nz(t,1.2,.14,3000);
if(st===0)pad(tr.map(x=>r+12+x),t,sd*16,.03+.03*I);
if(BP[k.bs][st]==='1')note('sawtooth',r+(st%8===6?12:0),t,sd*1.8,.16+.1*I,bus,500+I*1800);
if(st%4===0)kick(t,.3+.4*I);
if((st===4||st===12)&&I>.2)nz(t,.25,.2+.15*I,1200);
if(st%2)nz(t,.05,.04+.05*I,7000);else if(I>.45&&st%4)nz(t,.03,cl((I-.4)*.08,0,.035),8000);
if(I>.25)note(k.aw,r+24+tr[k.ap[st]%3]+(k.ap[st]>2?12:0),t,sd*1.6,cl((I-.22)*.14,0,.07),ax,1500+I*2500);
if(I>.6&&st%4===0)note('sawtooth',r+36+tr[(st>>2)%3],t,sd*3.5,cl((I-.55)*.14,0,.055),ax,2500)}
function sched(){if(!ac||ac.state!=='running'||!mf)return;const now=ac.currentTime;mg.gain.setTargetAtTime(mmute?0:.3,now,.05);
if(nextT<now-.1)nextT=now+.05;
while(nextT<now+.15){let tg=.35;
if(state==='paused')tg=mi;else if(state==='play')tg=serveT>0?.25:.25+.65*cl((B.sp-340)/(DIFF[diff].mx-340)*.7+Math.min(rally,14)/14*.3,0,1)+(Math.max(pd[0].s,pd[1].s)>=WIN-1?.1:0);
mi+=(tg-mi)*.025;const sd=60/(trk(stp).b+8*mi)/4;
mf.frequency.setTargetAtTime(state==='paused'?450:state==='menu'?2800:16000,nextT,.2);dly.delayTime.setTargetAtTime(sd*3,nextT,.1);
if(!mmute)playStep(nextT,stp,sd);nextT+=sd;stp++}}
document.addEventListener('visibilitychange',()=>{if(!ac)return;document.hidden?ac.suspend():ac.resume()});

/* ---------- menu / state ---------- */
const ui=$('ui');
function menu(title,sub,items,fi=0){$('title').textContent=title;$('sub').textContent=sub;const box=$('btns');box.textContent='';
items.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{unlock();f()};box.append(b)});ui.classList.remove('off');(box.children[fi]||box.firstChild).focus()}
const mainMenu=(fi=0)=>menu('PING PONG','',[[T('play'),()=>start(1)],[T('settings'),()=>settings(()=>mainMenu(1))]],fi);
function settings(back,fi=0){menu(T('settings'),T('d')[diff][1],[[T('diff')+': '+T('d')[diff][0],()=>{diff=(diff+1)%4;save();settings(back,0)}],[T('music')+': '+T(mmute?'off':'on'),()=>{mmute=!mmute;save();settings(back,1)}],[T('sound')+': '+T(muted?'off':'on'),()=>{muted=!muted;save();beep(660,.08);settings(back,2)}],[T('lang')+': '+T('lname'),()=>{lang=lang==='en'?'ru':'en';save();applyLang();settings(back,3)}],[T('back'),back]],fi)}
function start(m){newSong();bgi=(bgi+1)%2;flash=1;mode=m;pd[0].s=pd[1].s=0;pd.forEach(q=>q.y=q.ty=H/2);serve(Math.random()<.5?1:-1,1.5);state='play';ui.classList.add('off')}
function toMenu(){mode=0;pd[0].s=pd[1].s=0;serve(1,.5);state='menu';mainMenu()}
function resume(){state=prev;ui.classList.add('off')}
function togglePause(){if(state==='paused')return resume();if(state!=='play')return;prev=state;state='paused';pauseMenu()}
function pauseMenu(fi=0){menu(T('pause'),'',[[T('resume'),resume],[T('settings'),()=>settings(()=>pauseMenu(1))],[T('menu'),toMenu]],fi)}
function serve(dir,delay=1.2){B.x=W/2;B.y=H/2;B.sp=340;rally=0;B.tr=[];const a=(Math.random()-.5)*.8;B.vx=dir*Math.cos(a)*B.sp;B.vy=Math.sin(a)*B.sp;serveT=delay}
function over(i){
[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.18,'square',.06,0,1),k*110));
mode=0;state='menu';serve(i===0?1:-1,.8);overMenu(i)}
function overMenu(i,fi=0){menu(T(i===0?'win':'lose'),`${pd[0].s} : ${pd[1].s}`,[[T('again'),()=>start(1)],[T('settings'),()=>settings(()=>overMenu(i,1))]],fi)}

/* ---------- input ---------- */
addEventListener('keydown',e=>{unlock();if(e.code==='ArrowUp'||e.code==='ArrowDown')e.preventDefault();keys[e.code]=true;
if(e.code==='KeyP'||e.code==='Escape')togglePause()});
addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)togglePause2()});
function togglePause2(){if(state==='play')togglePause()}
function ptr(e){unlock();const r=cv.getBoundingClientRect(),y=(rot?(e.clientX-r.left)/r.width:(e.clientY-r.top)/r.height)*H,i=0;
if(state==='play')pd[i].ty=cl(y,20+PH/2,H-20-PH/2)}
const mq=matchMedia('(orientation:portrait) and (max-width:900px)');let rot=mq.matches;mq.addEventListener('change',e=>rot=e.matches);
addEventListener('pointermove',ptr);addEventListener('pointerdown',ptr);

/* ---------- fx ---------- */
function burst(x,y,c,n,sp=260){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c,z:1+Math.random()*2.5})}}

/* ---------- logic ---------- */
function ai(i,dt){const q=pd[i],toward=i===1?B.vx>0:B.vx<0,want=toward?B.y+q.err:H/2,d=want-q.ty,m=(mode===0?400:DIFF[diff].sp)*dt;
if(Math.abs(d)>6)q.ty+=cl(d,-m,m);q.ty=cl(q.ty,20+PH/2,H-20-PH/2)}
function movePaddles(dt){
let d1=(keys.KeyS?1:0)-(keys.KeyW?1:0),d2=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
d1=cl(d1+d2,-1,1);
if(mode>0){pd[0].ty=cl(pd[0].ty+d1*500*dt,20+PH/2,H-20-PH/2)}

ai(1,dt);if(mode===0)ai(0,dt);
pd.forEach((q,i)=>{q.y+=(q.ty-q.y)*Math.min(1,dt*22);q.g=Math.max(0,q.g-dt*4);spark(q,i,dt)})}
function spark(q,i,dt){const mv=Math.abs(q.ty-q.y)>8?2:1;if(Math.random()<dt*(6+Math.min(rally,20)*1.2)*mv)parts.push({x:i?q.x:q.x+PW,y:q.y+(Math.random()-.5)*PH,vx:(i?-1:1)*(30+Math.random()*70),vy:(Math.random()-.5)*50,l:.7,c:q.c,z:1+Math.random()*1.8})}
function paddleHit(i,q){
const rel=cl((B.y-q.y)/(PH/2),-1,1),a=rel*1,dir=i===0?1:-1;
B.sp=Math.min(B.sp*(1+DIFF[diff].acc),DIFF[diff].mx);B.vx=dir*Math.cos(a)*B.sp;B.vy=Math.sin(a)*B.sp;B.x=i===0?q.x+PW+R:q.x-R;
q.g=1;rally++;shake=Math.max(shake,3+(B.sp-340)/90);burst(B.x,B.y,q.c,18+Math.min(rally,20));rings.push({x:B.x,y:B.y,r:6,l:1,c:q.c,v:260});
pd[1-i].err=(Math.random()-.5)*(mode?DIFF[diff].err:80);beep(440+rally*18,.09)}
function score(i){
const ex=i===0?W-6:6;burst(ex,B.y,pd[i].c,46,460);rings.push({x:ex,y:B.y,r:6,l:1,c:pd[i].c,v:620});shake=14;flash=.8;
if(mode===0)return serve(i===0?1:-1,.8);
pd[i].s++;beep(300,.35,'sawtooth',.07,.3);
if(pd[i].s>=WIN)return over(i);serve(i===0?1:-1,1.2)}
function moveBall(dt){

B.x+=B.vx*dt;B.y+=B.vy*dt;
const top=14+R,bot=H-14-R;
if(B.y<top){B.y=top;B.vy=Math.abs(B.vy);shake=Math.max(shake,2);beep(220,.05,'triangle',.07)}
if(B.y>bot){B.y=bot;B.vy=-Math.abs(B.vy);shake=Math.max(shake,2);beep(220,.05,'triangle',.07)}
for(let i=0;i<2;i++){const q=pd[i],ok=i===0?B.vx<0&&B.x-R<=q.x+PW&&B.x+R>=q.x:B.vx>0&&B.x+R>=q.x&&B.x-R<=q.x+PW;
if(ok&&Math.abs(B.y-q.y)<=PH/2+R*.8)paddleHit(i,q)}
if(B.x<-30)score(1);else if(B.x>W+30)score(0)}
function update(dt){
t+=dt;scroll+=dt*(.3+Math.max(0,B.sp-340)/500);
if(state==='menu'||state==='play'){movePaddles(dt);if(serveT>0)serveT-=dt;else{B.tr.push({x:B.x,y:B.y});if(B.tr.length>9)B.tr.shift();const n=Math.ceil(B.sp*dt/10);for(let i=0;i<n&&serveT<=0;i++)moveBall(dt/n)}}
R+=(8*(1+.12*Math.min(1,rally/14)+.13*cl((B.sp-340)/(DIFF[diff].mx-340),0,1))-R)*Math.min(1,dt*6);lz+=((state==='menu'||serveT>0?1:.12)-lz)*Math.min(1,dt*2.5);shake*=Math.exp(-dt*9);flash=Math.max(0,flash-dt*3);
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.l-=dt*1.8;if(p.l<=0)parts.splice(i,1)}
for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=r.v*dt;r.l-=dt*1.8;if(r.l<=0)rings.splice(i,1)}}

/* ---------- drawing ---------- */
/* backgrounds: 0 = laser show + equalizer, 1 = Memphis + VHS; switches on every new game */
let an,lz=1,bgi=Math.random()*2|0;const fd=new Uint8Array(128),td=new Uint8Array(256);
function ana(){if(an){an.getByteFrequencyData(fd);an.getByteTimeDomainData(td)}else{fd.fill(0);td.fill(128)}}
const lv=(i,n)=>{const b=1+Math.floor(Math.pow(i/n,1.5)*80);return Math.min(1,Math.max(Math.max(fd[b],fd[b+1])/255*(.9+i/n*.9),.1+.08*Math.sin(t*2.2+i*.6)))};
const pulse=()=>Math.max(cl(((fd[1]+fd[2]+fd[3])/765-.35)*2.2,0,1),cl(shake/12,0,1));
const LZ=[[0,0,.8,.45,.7,0,185],[0,0,.45,.4,-.9,2,320],[W,0,2.35,.45,.8,1,320],[W,0,2.7,.4,-.6,4,185],[W/2,0,1.57,.8,.5,3,270],[W*.25,H,-1.2,.5,.8,5,320],[W*.75,H,-1.95,.5,-.7,6,185]];
function bgLaser(){
const cx=W/2,pl=pulse();
let g=ctx.createRadialGradient(cx,H*.45,10,cx,H*.45,W*.7);g.addColorStop(0,'#2b0a5c');g.addColorStop(1,'#05010d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle=`rgba(90,70,255,${pl*.1*lz})`;ctx.fillRect(0,0,W,H);
ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
for(const[x,y,a0,sw,sp,ph,hu]of LZ){const a=a0+Math.sin(t*sp+ph)*sw;
ctx.strokeStyle=`hsl(${225+(hu-185)/135*50},85%,50%)`;ctx.globalAlpha=(.07+pl*.06)*lz;ctx.lineWidth=12+pl*6;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*900,y+Math.sin(a)*900);ctx.stroke();
ctx.globalAlpha=(.3+pl*.3)*lz;ctx.lineWidth=1.4+pl;ctx.stroke()}
const N=32,bw=W/N,hs=[];for(let i=0;i<N;i++)hs.push(Math.round(lv(i,N)*14));
ctx.globalAlpha=.5;for(let j=0;j<14;j++){ctx.fillStyle=`hsl(${185+j*10},100%,${55+j}%)`;for(let i=0;i<N;i++)if(hs[i]>j)ctx.fillRect(i*bw+2,H-24-j*8,bw-4,6)}
ctx.globalAlpha=.25;for(let j=0;j<7;j++){ctx.fillStyle=`hsl(${320-j*8},100%,60%)`;for(let i=0;i<N;i++)if(hs[N-1-i]>j*2)ctx.fillRect(i*bw+2,22+j*8,bw-4,6)}
ctx.globalAlpha=.06+.24*lz;ctx.strokeStyle='#19f0ff';ctx.lineWidth=1.5;ctx.beginPath();
for(let i=0;i<=64;i++){const x=i/64*W,y=H/2+(td[i*4]-128)/128*70+Math.sin(i*.35+t*3)*5;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
ctx.stroke();ctx.restore();
ctx.save();ctx.translate(cx,H/2);ctx.scale(W*.5/(H*.4),1);const dg=ctx.createRadialGradient(0,0,0,0,0,H*.4);dg.addColorStop(0,'rgba(4,1,12,.92)');dg.addColorStop(.55,'rgba(4,1,12,.82)');dg.addColorStop(1,'rgba(4,1,12,0)');ctx.fillStyle=dg;ctx.fillRect(-W,-H,W*2,H*2);ctx.restore()}
const MM=Array.from({length:24},(_,i)=>({k:i%6,x:Math.random()*W,y:Math.random()*H,s:14+Math.random()*24,vx:(Math.random()-.5)*16,vy:6+Math.random()*10,r:Math.random()*6,w:(Math.random()-.5)*1.2,c:['#19f0ff','#ff2bd6','#ffe53b','#b79bff'][i%4]}));
function bgMemphis(){
const pl=pulse();
let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1a0b4d');g.addColorStop(.55,'#4a0f6e');g.addColorStop(1,'#7a1a73');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(255,255,255,.1)';const o=(t*10)%28;for(let y=-28+o;y<H;y+=28)for(let x=-28+o;x<W;x+=28)ctx.fillRect(x,y,2,2);
ctx.lineWidth=3;ctx.lineJoin='round';
for(const m of MM){const x=((m.x+m.vx*t)%W+W)%W,y=((m.y+m.vy*t)%H+H)%H,s=m.s*(1+pl*.25);
ctx.save();ctx.translate(x,y);ctx.rotate(m.r+m.w*t);ctx.strokeStyle=m.c;ctx.fillStyle=m.c;ctx.globalAlpha=m.k>3?.35+pl*.2:.55+pl*.3;ctx.beginPath();
switch(m.k){
case 0:ctx.moveTo(0,-s);ctx.lineTo(s*.87,s*.5);ctx.lineTo(-s*.87,s*.5);ctx.closePath();break;
case 1:ctx.arc(0,0,s*.8,0,TAU);break;
case 2:for(let j=0;j<=6;j++)ctx.lineTo(-s+j*s/3,(j%2?-1:1)*s*.35);break;
case 3:ctx.moveTo(-s,0);ctx.lineTo(s,0);ctx.moveTo(0,-s);ctx.lineTo(0,s);break;
case 4:ctx.rect(-s*.7,-s*.7,s*1.4,s*1.4);break;
default:ctx.arc(0,0,s*.8,0,Math.PI);ctx.closePath()}
m.k>3?ctx.fill():ctx.stroke();ctx.restore()}
ctx.fillStyle='rgba(255,255,255,.09)';for(let i=0;i<5;i++)ctx.fillRect(Math.random()*W,Math.random()*H,20+Math.random()*120,1+Math.random()*1.5);
const by=(t*55)%(H+90)-45;ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(0,by,W,22);ctx.fillStyle='rgba(255,43,214,.12)';ctx.fillRect(0,by+22,W,2);ctx.fillStyle='rgba(25,240,255,.12)';ctx.fillRect(0,by-2,W,2);
ctx.save();ctx.textAlign='left';ctx.font="700 16px 'Russo One',Orbitron,monospace";ctx.fillStyle='rgba(255,255,255,.75)';ctx.shadowColor='#19f0ff';ctx.shadowBlur=6;
const sec=Math.floor(t);tx('▶ PLAY',26,38);tx(`SP 0:${String(Math.floor(sec/60)%60).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`,26,58);ctx.restore()}
function bg(){ana();(bgi?bgMemphis:bgLaser)();ctx.fillStyle=`rgba(10,2,32,${bgi?.3:.15})`;ctx.fillRect(0,0,W,H)}
function court(){
ctx.save();const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#19f0ff');g.addColorStop(1,'#ff2bd6');
ctx.fillStyle=g;ctx.shadowColor='#ff2bd6';ctx.shadowBlur=14;ctx.fillRect(0,10,W,4);ctx.fillRect(0,H-14,W,4);
ctx.shadowBlur=0;ctx.setLineDash([12,14]);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2,18);ctx.lineTo(W/2,H-18);ctx.stroke();ctx.restore()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function paddle(q){const y=q.y-PH/2;ctx.save();ctx.shadowColor=q.c;ctx.shadowBlur=18+q.g*30;ctx.fillStyle=q.c;rr(q.x,y,PW,PH,6);ctx.fill();
ctx.shadowBlur=0;ctx.fillStyle=`rgba(255,255,255,${.7+q.g*.3})`;rr(q.x+PW/2-2,y+8,4,PH-16,2);ctx.fill();ctx.restore()}
function ball(){
const h=Math.min(1,rally/14),hue=52+h*30,sat=20+h*80,gs=Math.min(100,sat+35),lit=88-h*18,fl=.92+Math.sin(t*23)*.05+Math.random()*.04,r=serveT>0?R*(1+.2*Math.sin(t*20)):R,x=B.x,y=B.y;
ctx.globalCompositeOperation='lighter';

B.tr.forEach((p,i)=>{const a=(i+1)/B.tr.length;ctx.fillStyle=`hsla(${hue},${gs}%,${lit}%,${a*(.22+h*.2)})`;ctx.beginPath();ctx.arc(p.x,p.y,r*(.35+.55*a),0,TAU);ctx.fill()});
const cr=r*(2+h*1.8)*fl;let g=ctx.createRadialGradient(x,y,r*.6,x,y,cr);
g.addColorStop(0,`hsla(${hue},${gs}%,${lit}%,.7)`);g.addColorStop(.35,`hsla(${hue+10},${gs}%,${lit-12}%,.22)`);g.addColorStop(1,`hsla(${hue+25},${gs}%,${lit-15}%,0)`);
ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,cr,0,TAU);ctx.fill();
ctx.globalCompositeOperation='source-over';
ctx.save();ctx.shadowColor=`hsl(${hue},${gs}%,${lit-8}%)`;ctx.shadowBlur=r*(1.4+h*1.6)*fl;
g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.45,`hsl(${hue-6},${sat}%,${Math.min(96,lit+6)}%)`);g.addColorStop(1,`hsl(${hue+14},${gs}%,${lit-12}%)`);
ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.shadowBlur=r*(.6+h*.5)*fl;ctx.fill();ctx.restore();
ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();ctx.globalCompositeOperation='lighter';ctx.lineWidth=2;
for(let k=0;k<3;k++){const a=t*(5+k*2)+k*2.1;ctx.strokeStyle=`hsla(${hue+20+k*14},${gs}%,${70+k*5}%,.55)`;ctx.beginPath();ctx.arc(x+Math.cos(a*.7)*r*.35,y+Math.sin(a*.9)*r*.35,r*.55,a,a+2.2);ctx.stroke()}
ctx.restore();
}
function tx(s,x,y){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(Math.PI/2);ctx.fillText(s,0,0);ctx.restore()}
function hud(){
ctx.save();ctx.textAlign='center';ctx.font="900 64px Orbitron,'Russo One',sans-serif";
pd.forEach((q,i)=>{ctx.shadowColor=q.c;ctx.shadowBlur=22;ctx.fillStyle=q.c;ctx.globalAlpha=.9;tx(q.s,W/2+(i?1:-1)*90,82)});
if(serveT>0){ctx.font="700 22px Orbitron,'Russo One',sans-serif";ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=12;ctx.globalAlpha=.5+.5*Math.sin(t*12);tx(T('ready'),W/2,H/2-44)}
ctx.restore()}
function draw(){
ctx.setTransform(scale,0,0,scale,0,0);bg();
ctx.save();if(shake>.2)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
court();if(mode>0)hud();pd.forEach(paddle);ball();
ctx.globalCompositeOperation='lighter';
for(const p of parts){ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.z,p.z)}
for(const r of rings){ctx.globalAlpha=r.l;ctx.strokeStyle=r.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke()}
ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.25})`;ctx.fillRect(0,0,W,H)}}

/* ---------- loop ---------- */
let last=performance.now();
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(state!=='paused')update(dt);draw();pbtn.classList.toggle('x',state==='menu');requestAnimationFrame(loop)}
applyLang();serve(1,.5);mainMenu();requestAnimationFrame(loop);
</script>
</body>
