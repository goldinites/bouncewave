<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bouncewave</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#0b0320" />
    <meta
      name="description"
      content="Synthwave pong with procedural music, neon backgrounds and an AI opponent."
    />
    <!-- Launched from the home screen on iOS: no Safari chrome, the status bar over the night sky -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bouncewave" />
    <link
      href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="game" id="gameContainer">
      <div class="game__stage" id="gameStage">
        <div class="game__border" aria-hidden="true"></div>
        <canvas class="game__canvas" id="gameCanvas" width="800" height="500"></canvas>
        <div class="game__ui" id="gameUI">
          <h1 class="game__title" id="gameTitle">BOUNCEWAVE</h1>
          <p class="game__subtitle" id="gameSubtitle"></p>
          <div class="game__buttons" id="gameButtons"></div>
        </div>
      </div>
    </div>

    <p class="game-hint" id="gameHint"></p>

    <button class="game-pause" id="pauseButton" aria-label="Pause">
      <!-- The pause sign drawn as the game's two paddles -->
      <span class="game-pause__bar game-pause__bar--left" aria-hidden="true"></span>
      <span class="game-pause__bar game-pause__bar--right" aria-hidden="true"></span>
    </button>

    <!-- What's playing: tap the record to turn the music on or off, the arrows to skip -->
    <div class="now-playing" id="nowPlaying">
      <button class="now-playing__toggle" id="musicToggle" aria-pressed="true">
        <span class="now-playing__record" aria-hidden="true"></span>
        <span class="now-playing__title" id="nowPlayingTitle"></span>
      </button>
      <button class="now-playing__next" id="nextTrack">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 3.5 8 8l-6 4.5zM8 3.5 14 8l-6 4.5z" />
        </svg>
      </button>
    </div>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
