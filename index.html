<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No zoom: a game steered by dragging has no use for it. Android honors this, iOS doesn't,
         so InputHandler blocks the double tap and the pinch there -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Bouncewave</title>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="__BACKGROUND__" />
    <meta
      name="description"
      content="Synthwave pong with procedural music, neon backgrounds and an AI opponent."
    />
    <!-- Launched from the home screen on iOS: no Safari chrome, the status bar over the night sky -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bouncewave" />
    <!-- Launch screens for the last four iPhone generations: the launch mark, which the loader below
         picks up in the same place. Written by `npm run icons` (scripts/splash.mjs) -->
    <!-- splash:start -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-portrait-1320x2868.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/splash/apple-splash-landscape-2868x1320.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-portrait-1206x2622.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/splash/apple-splash-landscape-2622x1206.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-portrait-1260x2736.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/splash/apple-splash-landscape-2736x1260.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-portrait-1290x2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/splash/apple-splash-landscape-2796x1290.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-portrait-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/splash/apple-splash-landscape-2556x1179.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-portrait-1170x2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/splash/apple-splash-landscape-2532x1170.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-portrait-1284x2778.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/splash/apple-splash-landscape-2778x1284.png"
    />
    <!-- splash:end -->

    <!-- The loader paints before any stylesheet arrives, so its styles are here. The mark is
         40vmin, the size the launch screens draw it at; the ball rallies between the paddles -->
    <style>
      html {
        background: __BACKGROUND__;
      }

      .boot {
        position: fixed;
        inset: 0;
        z-index: 100;

        display: grid;
        place-items: center;

        background: __BACKGROUND__;

        transition:
          opacity 0.35s,
          visibility 0.35s;
      }

      .boot--done {
        visibility: hidden;
        opacity: 0;
      }

      .boot__mark {
        width: 40vmin;
        height: 40vmin;
      }

      .boot__ball {
        animation: boot-rally 1.2s linear infinite;
      }

      @keyframes boot-rally {
        25% {
          transform: translateX(110px);
        }
        75% {
          transform: translateX(-110px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot__ball {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot" id="boot" aria-hidden="true">
      <svg class="boot__mark" viewBox="0 0 512 512">
        <defs>
          <filter id="bootGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="7" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <rect
          x="96"
          y="196"
          width="30"
          height="120"
          rx="12"
          fill="#19f0ff"
          filter="url(#bootGlow)"
        />
        <rect
          x="386"
          y="196"
          width="30"
          height="120"
          rx="12"
          fill="#ff2bd6"
          filter="url(#bootGlow)"
        />
        <circle
          class="boot__ball"
          cx="256"
          cy="256"
          r="20"
          fill="#ffffff"
          filter="url(#bootGlow)"
        />
      </svg>
    </div>

    <!-- The controls sit in bars of the court's own width above and below it, never on it -->
    <div class="game-bar game-bar--top">
      <button class="game-pause" id="pauseButton" aria-label="Pause">
        <!-- The pause sign drawn as the game's two paddles -->
        <span class="game-pause__bar game-pause__bar--left" aria-hidden="true"></span>
        <span class="game-pause__bar game-pause__bar--right" aria-hidden="true"></span>
      </button>

      <!-- What's playing: tap the record to turn the music on or off, the arrows to skip -->
      <div class="now-playing" id="nowPlaying">
        <button class="now-playing__toggle" id="musicToggle" aria-pressed="true">
          <span class="now-playing__record" aria-hidden="true"></span>
          <span class="now-playing__title" id="nowPlayingTitle"></span>
        </button>
        <button class="now-playing__next" id="nextTrack">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 3.5 8 8l-6 4.5zM8 3.5 14 8l-6 4.5z" />
          </svg>
        </button>
      </div>
    </div>

    <div class="game" id="gameContainer">
      <div class="game__stage" id="gameStage">
        <div class="game__border" aria-hidden="true"></div>
        <canvas class="game__canvas" id="gameCanvas" width="800" height="500"></canvas>
        <div class="game__ui" id="gameUI">
          <h1 class="game__title" id="gameTitle">BOUNCEWAVE</h1>
          <p class="game__subtitle" id="gameSubtitle"></p>
          <div class="game__buttons" id="gameButtons"></div>
          <div class="game__screen" id="gameScreen"></div>
        </div>
      </div>
    </div>

    <div class="game-bar game-bar--bottom">
      <p class="game-condition" id="gameCondition"></p>
    </div>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
