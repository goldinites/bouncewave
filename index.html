<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Retrowave Pong</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Russo+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="game" id="gameContainer">
      <div class="game__stage" id="gameStage">
        <canvas class="game__canvas" id="gameCanvas" width="800" height="500"></canvas>
        <div class="game__ui" id="gameUI">
          <h1 class="game__title" id="gameTitle">PING PONG</h1>
          <p class="game__subtitle" id="gameSubtitle"></p>
          <div class="game__buttons" id="gameButtons"></div>
        </div>
      </div>
    </div>

    <p class="game-hint" id="gameHint"></p>

    <button class="game-pause" id="pauseButton" aria-label="Pause">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="currentColor">
        <path d="M8 19c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2s-2 .9-2 2v10c0 1.1.9 2 2 2zm6-12v10c0 1.1.9 2 2 2s2-.9 2-2V7c0-1.1-.9-2-2-2s-2 .9-2 2z"/>
      </svg>
    </button>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
